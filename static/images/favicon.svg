<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MIDAP">
  <!-- MIDAP favicon: an accelerator chip die with an "M" datapath monogram -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- chip pins -->
  <g fill="#2563eb">
    <rect x="10" y="2.5" width="2.4" height="3" rx="1"/>
    <rect x="14.8" y="2.5" width="2.4" height="3" rx="1"/>
    <rect x="19.6" y="2.5" width="2.4" height="3" rx="1"/>
    <rect x="10" y="26.5" width="2.4" height="3" rx="1"/>
    <rect x="14.8" y="26.5" width="2.4" height="3" rx="1"/>
    <rect x="19.6" y="26.5" width="2.4" height="3" rx="1"/>
    <rect x="2.5" y="10" width="3" height="2.4" rx="1"/>
    <rect x="2.5" y="14.8" width="3" height="2.4" rx="1"/>
    <rect x="2.5" y="19.6" width="3" height="2.4" rx="1"/>
    <rect x="26.5" y="10" width="3" height="2.4" rx="1"/>
    <rect x="26.5" y="14.8" width="3" height="2.4" rx="1"/>
    <rect x="26.5" y="19.6" width="3" height="2.4" rx="1"/>
  </g>
  <!-- die -->
  <rect x="6" y="6" width="20" height="20" rx="4" fill="#2563eb"/>
  <!-- "M" monogram -->
  <path d="M10.5 21.5 L10.5 10.5 L16 16.5 L21.5 10.5 L21.5 21.5"
        fill="none" stroke="#ffffff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
